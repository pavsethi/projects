name: orchbench CI

# Workflows only run from the repository-root .github/workflows/ directory, so
# this lives here (not under AgentOrchestratorBench/) and scopes itself to the
# project with path filters + a working-directory default.
on:
  push:
    paths:
      - "AgentOrchestratorBench/**"
      - ".github/workflows/orchbench-ci.yml"
  pull_request:
    paths:
      - "AgentOrchestratorBench/**"
      - ".github/workflows/orchbench-ci.yml"

defaults:
  run:
    working-directory: AgentOrchestratorBench

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Type-check
        run: mypy
      - name: Test
        run: pytest -q
      - name: Smoke-test the CLI (no API keys)
        run: orchbench demo --seeds 2
