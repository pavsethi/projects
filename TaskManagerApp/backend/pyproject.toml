[project]
name = "task-manager-backend"
version = "1.0.0"
description = "FastAPI backend for the Task Manager app (revamp of the original py4web project)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "email-validator>=2.2",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
]

[tool.uv]
# This is an application run from source (uvicorn adds the workdir to sys.path),
# not a distributable package — don't try to build/install it as a wheel.
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
